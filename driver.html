<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b3f6d" />
    <title>ЭкваЛайн — Панель водителя</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260618calcplan" />
    <link rel="stylesheet" href="responsive-mobile.css?v=20260618calcplan" />
  </head>
  <body class="driver-page">
    <header class="drv-topbar">
      <div class="drv-topbar-inner">
        <strong class="drv-brand" aria-current="page">ЭкваЛайн — водитель</strong>
        <div class="drv-topbar-actions">
          <span class="drv-meta" id="drvUserMeta" hidden></span>
          <button type="button" class="drv-btn drv-btn-ghost" id="drvRefreshBtn" hidden title="Обновить список">
            Обновить
          </button>
          <button type="button" class="drv-btn drv-btn-ghost" id="drvLogoutBtn" hidden>Выйти</button>
        </div>
      </div>
    </header>

    <main class="drv-shell">
      <section class="drv-card drv-card-login" id="drvLoginCard">
        <h1 class="drv-h1">Вход для водителя</h1>
        <p class="drv-muted">
          Учётную запись создаёт администратор. Войдите по email или телефону (+7…) и паролю. ФИО в профиле должно совпадать
          с тем, что оператор указал в заказе в поле «Водитель».
        </p>
        <form id="drvLoginForm" class="drv-form" novalidate>
          <label class="drv-label">
            Email или телефон +7
            <input type="text" name="credential" class="drv-input" autocomplete="username" required />
          </label>
          <label class="drv-label">
            Пароль
            <input type="password" name="password" class="drv-input" autocomplete="current-password" required />
          </label>
          <p class="drv-error" id="drvLoginError" aria-live="polite"></p>
          <button type="submit" class="drv-btn drv-btn-primary">Войти</button>
        </form>
        <div class="drv-login-extra">
          <a class="drv-btn drv-btn-outline-admin" href="admin.html">← Админ-панель</a>
          <p class="drv-login-link-soft"><a href="index.html">На главную сайта</a></p>
        </div>
      </section>

      <section class="drv-card drv-card-route" id="drvMainCard" hidden>
        <div class="drv-route-head">
          <div>
            <h1 class="drv-h1">Маршрут на сегодня</h1>
            <p class="drv-muted drv-intro" id="drvHint"></p>
          </div>
          <div class="drv-stats" id="drvStats" aria-live="polite"></div>
        </div>

        <div class="drv-legend" aria-label="Подсветка заказов">
          <span class="drv-legend-item drv-legend-item--way"><span class="drv-legend-dot"></span>В пути</span>
          <span class="drv-legend-item drv-legend-item--done"><span class="drv-legend-dot"></span>Доставлен</span>
          <span class="drv-legend-item drv-legend-item--wait"><span class="drv-legend-dot"></span>Ожидает этапа</span>
        </div>

        <p class="drv-sync" id="drvSyncAt" aria-live="polite"></p>

        <div id="drvOrdersList" class="drv-orders" role="list"></div>
      </section>
    </main>

    <div id="drvToast" class="drv-toast" hidden role="status">
      <span id="drvToastText"></span>
    </div>

    <script src="api-client.js"></script>
    <script src="client-guard.js?v=20260618calcplan"></script>
    <script src="orders-sync.js?v=20260618calcplan"></script>
    <script src="driver.js?v=20260618calcplan"></script>
  </body>
</html>

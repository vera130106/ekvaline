# Запуск: docker compose up -d --build
# Сайт: http://localhost:3001 (или https://домен через nginx)
# Перед первым запуском: cp .env.docker.example .env && npm run deploy:check
# Инструкция: docs/ВЫКЛАДКА-GIT-И-VPS.md

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ekvaline
      POSTGRES_PASSWORD: ekvaline
      POSTGRES_DB: ekvaline
    volumes:
      - ekvaline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ekvaline -d ekvaline']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    ports:
      - '${PORT:-3001}:3001'
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://ekvaline:ekvaline@db:5432/ekvaline
      SESSION_SECRET: ${SESSION_SECRET:-docker-local-dev-secret-min-32-chars!!}
      USE_SECURE_COOKIES: ${USE_SECURE_COOKIES:-}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      YANDEX_MAPS_API_KEY: ${YANDEX_MAPS_API_KEY:-}
      YANDEX_GEOCODER_API_KEY: ${YANDEX_GEOCODER_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-1}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3001}
      SEED_DEMO_ORDERS: ${SEED_DEMO_ORDERS:-0}
    depends_on:
      db:
        condition: service_healthy

volumes:
  ekvaline_pgdata:
